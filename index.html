<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <nav>
      <div class="nav-left-container">
        <h5>Total Price</h5>
        <h1 id="totalPrice">$0.00</h1>
      </div>
      <div class="nav-middle-container">
        <input id="searchBar" type="text" placeholder="Search..." />

        <!-- <svg
          id="filterBtn"
          xmlns="http://www.w3.org/2000/svg"
          class="bi bi-funnel"
          viewBox="0 0 16 16"
        >
          <path
            d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5zm1 .5v1.308l4.372 4.858A.5.5 0 0 1 7 8.5v5.306l2-.666V8.5a.5.5 0 0 1 .128-.334L13.5 3.308V2z"
          />
        </svg> -->
      </div>
      <div class="nav-right-container">
        <!-- <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
                </svg> -->
        <button id="addBtn">Add Item</button>
      </div>
    </nav>

    <section class="noti-popup hidden">
      <div class="additem-container hidden">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-x-lg close-modal"
          viewBox="0 0 16 16"
          id="addItemClose"

        >
          <path
            d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"
          />
        </svg>

        <div class="input-group" >
          <label for="addItemName">Item Name</label>
          <input type="text" id="addItemName" placeholder="Add Item Name" />
         
          <div id="alretSameContainer">

            <p id="alretSame">Item with this name exisited!</p>

          </div>
        
        </div>

        <div class="input-group">
          <label for="imageUpload">Upload Image<span>(Optional)</span> </label>
          <input type="text" name="imageUpload" id="imageUpload" placeholder="Enter An Image URL"/>
        </div>

        <div class="input-num-group">
          <div class="input-group">
            <label for="addPrice">Pirce</label>
            <input type="number" id="addPrice" placeholder="Enter Price" />
          </div>
          <div class="input-group">
            <label for="addQuantity">Quantity</label>
            <input
              type="number"
              id="addQuantity"
              placeholder="Enter Quantity"
            />
          </div>
        </div>

        <button id="addItemBtn">Add</button>
      </div>

      <div class="edititem-container hidden">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-x-lg close-modal"
          viewBox="0 0 16 16"
          id="editItemClose"
        >
          <path
            d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"
          />
        </svg>

        <div class="input-group">
          <label for="editItemName">Item Name</label>
          <input type="text" id="editItemName" placeholder="Edit Item Name" />
        </div>

        <div class="input-group">
          <label for="editImageUpload">Edit Image</label>
          <input  type="text" name="editImageUpload" id="editImageUpload" class="hidden" placeholder="Edit Image Url"/>
          <img src="" alt="" id="editImg">
        </div>

        <div class="input-num-group">
          <div class="input-group">
            <label for="editPrice">Pirce</label>
            <input type="number" id="editPrice" placeholder="Enter Price" />
          </div>
          <div class="input-group">
            <label for="editQuantity">Quantity</label>
            <input
              type="number"
              id="editQuantity"
              placeholder="Enter Quantity"
            />
          </div>
        </div>

        <button id="confirmEditBtn">Confirm Edit</button>
      </div>
    </section>

    <main>
      <section class="cards-container">

        
        
        <div class="card">
          <div class="dot-menu">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              fill="currentColor"
              class="bi bi-three-dots-vertical dot-icon"
              viewBox="0 0 16 16"
            >
              <path
                d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"
              />
            </svg>

            <div class="dot-menu-toggle">


              <button class="edit-btn">
                 <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil" viewBox="0 0 16 16">
                  <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325"/>
                </svg>  
                Edit
              </button>

              <button class="remove-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                  <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
                </svg>
              
                Delete
              
              </button>
            </div>
          </div>

          <div class="card-head">
            <h2>Item Name</h2>
          </div>

          <div class="card-body">
            
            <img
              src="../tarot deck/img/tarot_logo_no_bg-removebg .svg"
              alt="item"
              width="200px"
            />
          </div>

          <div class="card-footer">
            <p>Price: <span>$0.00</span></p>
            <p>Quantity: <span >0</span></p>
          </div>
        </div>

        
      </section>
      <div id="notFound">
        <h1 id="notFoundText">Not Found</h1>
      </div>
      
    </main>

    

    <script src="./data/items.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
