  <body>
    <nav>
      <div class="nav-left-container">
        <h5>Total Price</h5>
        <h1 id="totalPrice">$0.00</h1>
      </div>
      <div class="nav-middle-container">
        <input type="text" placeholder="Search..." />

        <svg
          id="filterBtn"
          xmlns="http://www.w3.org/2000/svg"
          class="bi bi-funnel"
          viewBox="0 0 16 16"
        >
          <path
            d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5zm1 .5v1.308l4.372 4.858A.5.5 0 0 1 7 8.5v5.306l2-.666V8.5a.5.5 0 0 1 .128-.334L13.5 3.308V2z"
          />
        </svg>
      </div>
      <div class="nav-right-container">
        <!-- <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
                </svg> -->
        <button id="addBtn">Add Item</button>
      </div>
    </nav>

    <section class="noti-popup hidden">
      <div class="additem-container hidden">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-x-lg close-modal"
          viewBox="0 0 16 16"
        >
          <path
            d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"
          />
        </svg>
        <div class="input-group">
          <label for="addItemName">Item Name</label>
          <input type="text" id="addItemName" placeholder="Add Item Name" />
        </div>

        <div class="input-group">
          <label for="imageUpload">Upload Image</label>
          <input type="file" name="imageUpload" id="imageUpload" />
        </div>

        <div class="input-num-group">
          <div class="input-group">
            <label for="addPrice">Pirce</label>
            <input type="number" id="addPrice" placeholder="Enter Price" />
          </div>
          <div class="input-group">
            <label for="addQuantity">Quantity</label>
            <input
              type="number"
              id="addQuantity"
              placeholder="Enter Quantity"
            />
          </div>
        </div>

        <button id="addItemBtn">Add</button>
      </div>

      <div class="edititem-container hidden">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-x-lg close-modal"
          viewBox="0 0 16 16"
        >
          <path
            d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"
          />
        </svg>

        <div class="input-group">
          <label for="editItemName">Item Name</label>
          <input type="text" id="editItemName" placeholder="Edit Item Name" />
        </div>

        <div class="input-group">
          <label for="imageUpload">Edit Image</label>
          <input  type="file" name="imageUpload" id="imageUpload" class="hidden"/>
          <img id="editImage" src="../tarot deck/img/tarot_logo_no_bg-removebg .svg" alt="">
        </div>

        <div class="input-num-group">
          <div class="input-group">
            <label for="editPrice">Pirce</label>
            <input type="number" id="editPrice" placeholder="Enter Price" />
          </div>
          <div class="input-group">
            <label for="editQuantity">Quantity</label>
            <input
              type="number"
              id="editQuantity"
              placeholder="Enter Quantity"
            />
          </div>
        </div>

        <button id="confirmEditBtn">Confirm Edit</button>
      </div>
    </section>

    <main>
      <section class="cards-container">
        <div class="card">
          <div class="dot-menu">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              fill="currentColor"
              class="bi bi-three-dots-vertical dot-icon"
              viewBox="0 0 16 16"
            >
              <path
                d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"
              />
            </svg>

            <div class="dot-menu-toggle">
              <button class="edit-btn">Edit</button>

              <button class="remove-btn">Remove</button>
            </div>
          </div>

          <div class="card-head">
            <h2>Item Name</h2>
          </div>

          <div class="card-body">
            <img
              src="../tarot deck/img/tarot_logo_no_bg-removebg .svg"
              alt="item"
              width="200px"
            />
          </div>

          <div class="card-footer">
            <p>Price: <span id="priceDisplay">$0.00</span></p>
            <p>Quantity: <span id="quantityDisplay">0</span></p>
          </div>
        </div>
        <div class="card">
          <div class="dot-menu">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              fill="currentColor"

              />
            </svg>

            <div class="dot-menu-toggle">

              <button class="remove-btn">Remove</button>

          </div>

          <div class="card-footer">
            <p>Price: <span id="priceDisplay">$0.00</span></p>

            <svg

              width="18"
              height="18"
              fill="currentColor"
              class="bi bi-three-dots-vertical dot-icon"
              viewBox="0 0 16 16"
            >
              <path
                d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"
              />
            </svg>

            <div class="dot-menu-toggle">
              <button class="edit-btn">Edit</button>

              <button class="remove-btn">Remove</button>

          <div class="card-body">

              alt="item"
              width="200px"
            />
          </div>

          <div class="card-footer">
            <p>Price: <span id="priceDisplay">$0.00</span></p>
            <p>Quantity: <span id="quantityDisplay">0</span></p>
          </div>
        </div>
        <div class="card">
          <div class="dot-menu">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              fill="currentColor"
              class="bi bi-three-dots-vertical dot-icon"
              viewBox="0 0 16 16"
            >
              <path
                d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"
              />
            </svg>

            <div class="dot-menu-toggle">
              <button class="edit-btn">Edit</button>

              <button class="remove-btn">Remove</button>
            </div>
          </div>

          <div class="card-head">
            <h2>Item Name</h2>
          </div>

          <div class="card-body">
            <img
              src="../tarot deck/img/tarot_logo_no_bg-removebg .svg"
              alt="item"
              width="200px"
            />
          </div>

          <div class="card-footer">
            <p>Price: <span id="priceDisplay">$0.00</span></p>
            <p>Quantity: <span id="quantityDisplay">0</span></p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
